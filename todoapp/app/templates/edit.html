{% extends "base.html" %}

{% block title %} Edit Todo {% endblock %}

{% block content %}
    <h1>Edit todo</h1>

    <form method="post" action="{{ url_for('todos.edit', todo_id=todo.id) }}">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" maxlength="200" value="{{ todo.title }}" required>

        <label for="description">Description</label>
        <textarea id="description" name="description">{{ todo.description or '' }}</textarea>

        <label>
            <input type="checkbox" name="completed" {% if todo.completed %}checked{% endif %}>
            Completed
        </label>

        <button type="submit">Save</button>
        <a href="{{ url_for('todos.index') }}">Cancel</a>
    </form>
{% endblock %}
