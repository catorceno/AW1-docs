services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-todo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-todoapp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-todo} -d ${POSTGRES_DB:-todoapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  web:
    build: .
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_HOST: db
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required} # :? -> detiene todo si falta
    volumes:
      - static_files:/app/app/static
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
  
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${HTTP_PORT:-8081}:80" # :- -> pone un valor por defecto
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/app/static:ro
    depends_on:
      - web
    networks:
      - frontend

volumes:
  postgres_data:
  static_files:

networks:
  frontend:
  backend:
    internal: true