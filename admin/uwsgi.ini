[uwsgi]

# wsgi-file -> indica la ubicación donde está la aplicación
# por defecto busca una variable llamada "application" en el archivo indicado
wsgi-file = config/wsgi.py

# evita que el servidor empiece si hay opciones que uWSGI no reconoce
strict = true
# abre ese puerto dentro del contenedor
socket = :8000
# indica qué idioma habla el socket, permite que en el browser se pueda abrir localhost:8000 por ejemplo
# por defecto socket usa protocolo binario de uWSGI
protocol = http

master = true
# en caso que el proceso master muera, no-orphans permite que no haya procesos huérfanos
no-orphans = true

# SIGNTERM es un signo que le pide al proceso que termine por favor -> docker envía este al contenedor cuando se hace docker stop
# uWSGI por defecto al recibir este signo se reinicia, por eso es necesario para que docker no llegue a hacer un SIGKILL
die-on-term = true

# lazy-apps -> delega la carga de la app a los workers, así master queda listo antes
lazy-apps = true

# processes = child processes = workers = application instances
# son los que atienden las peticiones
processes = 4
# número de threads usados por cada proceso -> el servidor puede manejar 32 (4x8) peticiones simultáneas
# 1 worker puede manejar 8 peticiones
threads = 8
# GIL (Global Interpreter Lock) -> indica que dentro de un mismo proceso, solo un hilo puede ejecutar çódigo python
# por tanto, hilos creados por el mismo código (por librerías por ejemplo), no se crean y se evita el riesgo de que queden colgados
enable-threads = true

# 500 indica cuántas peticiones atiende un worker en toda su vida, una tras otra antes de que se reinicie que es cuando libera memoria y empieza limpio de vuelta
max-requests = 500

# rss (Resident Set Size) -> es la RAM real que ocupa el worker
# 1024MB por worker
reload-on-rss = 1024

# si en 60s no murió el worker, se lo mata a la fuerza
worker-reload-mercy = 60

# espera 60s cuando hay un worker atendiendo, pero se quedo trabado, antes de mandar un error a esa petición del usuario
harakiri = 60
harakiri-verbose = true

# limpia archivo temporales que crea uWSGI para funcionar
# como socket UNIX que utiliza para conectarse a NGINX
vacuum = true

# buffer para el payload
# si payload < 1MB: entonces se guarda en memoria
# si payload > 1MB: entonces se escribe en un archivo temporal en el disco
# 1048576 bytes = 1024x1024 = 1MB por request
post-buffering = 1048576

# buffer para headers
# si super los 64KB se manda un error: invalid request block size
# 65535 bytes = 64KB por request
buffer-size = 65535
