# server -> is the virtual server which is the ports from the listen directive on which connections come in 
server {
    # listen -> directive on which connections come in
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _; # _ -> empty name to not look at the Host header

    root /data;

    # location -> special block directive
    # @ -> a named location -> used to redirect requests into them
    location @backend {
        proxy_cache my_cache;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 10m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # proxy_pass -> says where to send requests by location
        # this is called reverse proxying
        proxy_pass http://django;
    }

    location / {
        try_files $uri $uri/ @backend;
    }

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root html;
    }
}