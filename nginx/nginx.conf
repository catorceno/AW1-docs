upstream flask_app {
    # "web" es el nombre del servicio en docker-compose.
    # Docker provee DNS interno: no hace falta ninguna IP.
    server web:5000;
}

# Redirección HTTP → HTTPS
server {
    listen 80;
    server_name todo-camila.duckdns.org www.todo-camila.duckdns.org;

    # Let's Encrypt deja aquí el archivo de validación
    # El desafío ACME debe seguir siendo accesible por HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Servidor HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name todo-camila.duckdns.org www.todo-camila.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/todo-camila.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo-camila.duckdns.org/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: el navegador recordará usar solo HTTPS
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    client_max_body_size 10M;

    location /static/ {
        alias /app/app/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://flask_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}