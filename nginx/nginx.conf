upstream flask_app {
    # "web" es el nombre del servicio en docker-compose.
    # Docker provee DNS interno: no hace falta ninguna IP.
    server web:5000;
}

server {
    listen 80;
    server_name todo-camila.duckdns.org www.todo-camila.duckdns.org;
    server_tokens off;

    # Let's Encrypt deja aquí el archivo de validación
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 10M;

    location /static/ {
        alias /app/app/static/;
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://flask_app;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;

        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }
}