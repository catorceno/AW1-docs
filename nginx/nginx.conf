# un solo worker maneja muchas conexiones a la vez basándose en eventos
worker_processes 1;

events {
    # the number of server connections
    worker_connections 1024;
}

# responsable de procesar peticiones HTTP
http {
    include mime.types; # available data types in the Content-Type header
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    # removes additional copying and avoids calling read+write methods
    sendfile on;
    # responsable for sending headers and the beginning of files within a single TCP packet
    tcp_nodelay on;
    tcp_nopush on;
    # sets the maximum allowed size of the client request body
    # 200 MB
    client_max_body_size 200m;

    # compresión del contenido
    gzip on;
    gzip_comp_level 3; # 1 to 9 -> 1 fast and light, 9 maxium -> loads the CPU
    gzip_min_length 1000; # 1000 bytes -> después de 1000 bytes debe aplicarse la compresión
    gzip_types # indica qué contenido debe ser comprimido
        text/plain
        text/css
        application/json
        application/x-javascript
        text/xml
        text/javascript;
    
    proxy_redirect off; # to redirect a request to another host
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    upstream django {
        server admin:8000;
    }

    include conf.d/*.conf;

    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:10m max_size=1g inactive=60m use_temp_path=off;
}