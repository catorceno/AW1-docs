services:
  admin:
    build: admin/
    # la ruta es relativa al docker-compose
    env_file:
      - .env # Dockerfile copia admin/, por tanto no encontraba el .env que está un nivel arriba, docker-compose pasa las variable al contenedor sin meter el archivo dentro de la iamgen
    expose:
      - "8000"
  
  nginx:
    image: nginx:1.25.3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/configs:/etc/nginx/conf.d:ro
    depends_on:
      - admin
    ports:
      - "80:80"